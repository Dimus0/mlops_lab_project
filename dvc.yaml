stages:
  prepare:
    cmd: python src/prepare.py data/raw/telco_dataset.csv data/prepared
    deps:
      - src/prepare.py
      - data/raw/telco_dataset.csv
    outs:
      - data/prepared

  train:
    cmd: python src/train.py --n_estimators 100 --max_depth 15
    deps:
      - src/train.py
      - data/prepared/train.csv
      - data/prepared/test.csv